<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponder · Teacher Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath fill=%27%232E2A72%27 d=%27M12 30C12 19 21 10 32 10h2c11 0 20 9 20 20v2c0 11-9 20-20 20H20c-4 0-7 3-8 6z%27/%3E%3Ccircle cx=%2733%27 cy=%2731%27 r=%275.5%27 fill=%27%23F5A623%27/%3E%3C/svg%3E">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --glass: #FFFDF9;
            --glass-border: #E7E0D4;
            --blur: 0px;
            --primary: #2E2A72;
            --primary-end: #5A4FB8;
            --text: #1F1D3A;
            --muted: #726E8A;
            --border: #D2CABC;
            --danger: #C0392B;
            --radius: 16px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F0E8;
            color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .card {
            background: var(--glass); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border); border-radius: var(--radius);
            padding: 40px 36px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 8px 32px rgba(99,102,241,0.08); position: relative; z-index: 1;
        }
        .card h1 { font-family: Fraunces, Georgia, serif; font-size: 1.6rem; margin-bottom: 4px; }
        .brand-mark { display: inline-flex; align-items: center; gap: 10px; color: var(--primary); margin-bottom: 14px; }
        .brand-mark .logo { width: 40px; height: 40px; display: block; }
        .brand-mark .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 1.35rem; color: var(--text); }
        .card .sub { color: var(--muted); margin-bottom: 28px; font-size: 0.9rem; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 4px; }
        .form-group input {
            width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.5);
            border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 0.93rem; outline: none; font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn {
            display: inline-block; padding: 10px 24px; font-size: 0.93rem; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-end)); color: #fff;
            transition: transform 0.15s, box-shadow 0.15s; width: 100%;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.25); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error { color: var(--danger); margin-top: 8px; font-size: 0.82rem; }
        .success { color: #065f46; margin-top: 8px; font-size: 0.88rem; }
        .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.88rem; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-mark"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M12 30C12 19 21 10 32 10h2c11 0 20 9 20 20v2c0 11-9 20-20 20H20c-4 0-7 3-8 6z"/><circle cx="33" cy="31" r="5.5" fill="#F5A623"/></svg><span class="wordmark">Ponder</span></div>
        <h1>Teacher Registration</h1>
    <p class="sub">Create your teacher account with an invite code</p>
    <div id="register-form">
        <div class="form-group">
            <label>Invite Code</label>
            <input id="invite-code" placeholder="Paste your invite code">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input id="reg-user" placeholder="Choose a username (no spaces)">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="reg-pass" type="password" placeholder="Min 8 chars, letters & numbers"
                   onkeydown="if(event.key==='Enter')doRegister()">
        </div>
        <button class="btn" style="margin-top:8px" onclick="doRegister()">Register</button>
        <div class="error" id="reg-error"></div>
    </div>
    <div id="success-msg" class="hidden">
        <p class="success">Account created successfully!</p>
        <p style="margin-top:12px"><a href="/admin" class="link-btn">Go to Dashboard</a></p>
    </div>
    <p style="margin-top:16px">
        <a href="/admin" class="link-btn" style="font-size:0.82rem" onclick="localStorage.removeItem('admin_token');localStorage.removeItem('admin_role');">Already have an account? Sign in</a>
    </p>
</div>

<script>
// Pre-fill invite code from URL
const params = new URLSearchParams(window.location.search);
const codeFromUrl = params.get('code');
if (codeFromUrl) document.getElementById('invite-code').value = codeFromUrl;

async function doRegister() {
    const code = document.getElementById('invite-code').value.trim();
    const user = document.getElementById('reg-user').value.trim();
    const pass = document.getElementById('reg-pass').value;
    if (!code || !user || !pass) {
        document.getElementById('reg-error').textContent = 'All fields are required';
        return;
    }
    if (/\s/.test(user)) {
        document.getElementById('reg-error').textContent = 'Username must not contain spaces';
        return;
    }
    if (pass.length < 8) {
        document.getElementById('reg-error').textContent = 'Password must be at least 8 characters';
        return;
    }
    if (!/[a-zA-Z]/.test(pass) || !/[0-9]/.test(pass)) {
        document.getElementById('reg-error').textContent = 'Password must contain both letters and numbers';
        return;
    }
    try {
        const res = await fetch('/api/auth/register-teacher', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ invite_code: code, username: user, password: pass }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        // Store token and redirect
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_role', data.role || 'teacher');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('success-msg').classList.remove('hidden');
        setTimeout(() => window.location.href = '/admin', 1500);
    } catch (e) {
        document.getElementById('reg-error').textContent = e.message;
    }
}

// Hidden class helper
document.head.insertAdjacentHTML('beforeend', '<style>.hidden{display:none!important}</style>');
</script>
</body>
</html>
